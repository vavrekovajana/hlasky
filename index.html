body{

}

.wrap{
  max-width:760px;

  padding:5px;
}

.logo{

  font-size:30px;
  font-weight:900;

}

}

.slogan{

}

  background:#fff;
  border-radius:20px;
  padding:10px;

    0 10px 28px
    rgba(23,54,93,.12);
}

.center{
  text-align:center;
}

.hidden{
  display:none!important;
}

.levels{
  display:grid;
  gap:5px;
  margin:8px 0;
}

button{
  border:0;
  border-radius:13px;
  padding:8px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  font-family:Arial,sans-serif;
}

.level{
  background:#eef6ff;
  color:#17365d;
  border:2px solid transparent;
}

.level.active{
  background:#fff7e8;
  border-color:#ff9f1c;
}

.primary{
  width:100%;
  background:#2f80ed;
  color:white;
}

.secondary{
  background:#eef6ff;
  color:#17365d;
}

.mistakes{
  width:100%;
  margin-top:5px;
  background:#fff4df;
  color:#805400;
}

.allExercises{
  background:#fff4df;
  color:#805400;
}

.top,
.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.navButtons{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.badge{
  background:#fff4df;
  padding:7px 10px;
  border-radius:30px;
  font-weight:800;
}

.progress{
  height:6px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:5px 0;
}

.bar{
  height:100%;
  background:#ff9f1c;
  width:0;
}

.stats{
  font-size:12px;
  color:#65758b;
  font-weight:700;
}

.instruction{
  text-align:center;
  color:#65758b;
  font-weight:800;
  font-size:16px;
  margin-top:5px;
}

.question{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin:6px 0;
  line-height:1.25;
}

.answers{
  display:grid;
  gap:5px;
}

.answer{
  background:#fff;
  border:2px solid #dce7f2;
  color:#17365d;
  padding:7px;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.answer.keyboardSelected{
  border-color:#2f80ed;
  background:#eaf3ff;
  box-shadow:0 0 0 2px rgba(47,128,237,.12);
}

.answer:disabled{

}

.feedback{
  margin-top:5px;
  padding:5px 7px;
  border-radius:12px;
  font-size:12px;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;

}

#nextButton{

  padding:8px;
}

.score{

.footer{

@media(max-height:700px){

id=>document.getElementById(id);


/* =========================================
   NÁHODNÉ PORADIE
========================================= */

function shuffle(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=
    Math.floor(
      Math.random()*(i+1)
    );

    [a[i],a[j]]=
    [a[j],a[i]];
  }

  return a;
}


/* =========================================
   ZDROJ
========================================= */

function source(){

  if(selectedLevel===1){
    return level1;
  }

  if(selectedLevel===2){
    return level2;
  }

  return level3;
}


/* =========================================

========================================= */

function show(id){

  ["home","game","finish"]
  .forEach(
  name=>
    $(name)
    .classList
    .add("hidden")
  );

  $(id)
  .classList
  .remove("hidden");

  window.scrollTo(0,0);
}


/* =========================================
   CHYBY
========================================= */

function getMistakes(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "damtoHlaskyV3"
      ) || "{}"
    );

  }
  catch(error){

    return {};

  }
}


function setMistakes(data){

  localStorage.setItem(
    "damtoHlaskyV3",
    JSON.stringify(data)
  );

  updateMistakeCount();
}


function updateMistakeCount(){

  const number=
    Object.keys(
      getMistakes()
    ).length;

  $("mistakeCount")
  .textContent=
    " ("+number+")";
}

      );

    document
    .querySelectorAll(".level")
    .forEach(
    item=>
      item.classList
      .remove("active")
    );

    button
    .classList
    .add("active");

  });
});

/* =========================================
   TRÉNING
========================================= */

function startTraining(){

  const mistakes=
    getMistakes();

  const list=
    source();

  questions=[

    ...shuffle(
      list.filter(
      x=>
        mistakes[x.id]
      )
    ),

    ...shuffle(
      list.filter(
      x=>
        !mistakes[x.id]
      )
    )

  ].slice(0,10);

  current=0;
  score=0;

  show("game");

  render();
}


/* =========================================
   MOJE CHYBY
========================================= */

function startMistakeTraining(){

  const mistakes=
    getMistakes();

  const all=[
    ...level1,
    ...level2,
    ...level3
  ]
  .filter(
  x=>
    mistakes[x.id]
  );

  if(!all.length){

    alert(
      "🎉 Nemáš žiadne chyby na precvičenie."
    );

    return;
  }

  questions=
    shuffle(all)
    .slice(0,10);

  current=0;
  score=0;

  show("game");

  render();
}


/* =========================================
   OTÁZKA
========================================= */

function render(){

  locked=false;
  selectedAnswerIndex=0;

  if(current>=questions.length){

    finish();
    return;
  }

  const x=
    questions[current];

  $("counter")
  .textContent=
    (current+1)+
    " / "+
    questions.length;

  $("points")
  .textContent=
    score;

  $("bar")
  .style.width=
    (
      current /
      questions.length *
      100
    )+"%";

  $("levelBadge")
  .textContent=

    selectedLevel===1
    ? "⭐ Skúšam"

    : selectedLevel===2
    ? "⭐⭐ Už mi to ide"

    : "⭐⭐⭐ DámTo!";

  $("instruction")
  .textContent=

    x.i ||

    (
      selectedLevel===1

      ? "Je to samohláska alebo spoluhláska?"

      : "Do ktorej skupiny patrí?"
    );

  $("question")
  .textContent=
    x.q;

  $("feedback")
  .innerHTML="";

  $("feedback")
  .className="";

  $("nextButton")
  .classList
  .add("hidden");

  const box=
    $("answers");

  box.innerHTML="";

  const mixed=
    shuffle(x.o);

  mixed.forEach(
  (option,index)=>{

    const button=
      document
      .createElement("button");

    button.className=
      "answer";

    button.textContent=
      option;

    button.addEventListener(
    "click",
    ()=>{

      selectedAnswerIndex=
        index;

      updateKeyboardSelection();

      checkAnswer(
        option===x.c
      );

    });

    box.appendChild(
      button
    );
  });

  updateKeyboardSelection();
}


/* =========================================
   KLÁVESNICOVÝ VÝBER
========================================= */

function updateKeyboardSelection(){

  const buttons=[
    ...document
    .querySelectorAll(".answer")
  ];

  buttons.forEach(
  (button,index)=>{

    button.classList.toggle(
      "keyboardSelected",
      index===selectedAnswerIndex &&
      !button.disabled
    );

  });
}


/* =========================================
   KONTROLA
========================================= */

function checkAnswer(ok){

  if(locked){
    return;
  }

  locked=true;

  const x=
    questions[current];

  const mistakes=
    getMistakes();

  const feedback=
    $("feedback");

  if(ok){

    score++;

    delete mistakes[x.id];

    feedback.className=
      "feedback good";

    feedback.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }
  else{

    mistakes[x.id]=true;

    feedback.className=
      "feedback bad";

    feedback.innerHTML=
      "❌ <b>Nesprávne.</b> Správna odpoveď je <b>"+
      x.c+
      "</b>.";
  }

  setMistakes(
    mistakes
  );

  $("points")
  .textContent=
    score;

  document
  .querySelectorAll(".answer")
  .forEach(
  button=>
    button.disabled=true
  );

  $("nextButton")
  .classList
  .remove("hidden");
}


/* =========================================
   ĎALEJ
========================================= */

function nextQuestion(){

  current++;

  render();

  window.scrollTo(0,0);
}


/* =========================================
   ŠÍPKY + ENTER
========================================= */

document
.addEventListener(
"keydown",
event=>{

  if(
    $("game")
    .classList
    .contains("hidden")
  ){
    return;
  }

  const buttons=[
    ...document
    .querySelectorAll(".answer")
  ];

  if(
    locked &&
    event.key==="Enter"
  ){

    event.preventDefault();

    nextQuestion();

    return;
  }

  if(
    locked ||
    !buttons.length
  ){
    return;
  }

  if(
    event.key==="ArrowRight" ||
    event.key==="ArrowDown"
  ){

    event.preventDefault();

    selectedAnswerIndex=
      (
        selectedAnswerIndex+1
      )%
      buttons.length;

    updateKeyboardSelection();

    return;
  }

  if(
    event.key==="ArrowLeft" ||
    event.key==="ArrowUp"
  ){

    event.preventDefault();

    selectedAnswerIndex=
      (
        selectedAnswerIndex-1+
        buttons.length
      )%
      buttons.length;

    updateKeyboardSelection();

    return;
  }

  if(event.key==="Enter"){

    event.preventDefault();

    const selected=
      buttons[
        selectedAnswerIndex
      ];

    if(
      selected &&
      !selected.disabled
    ){

      selected.click();
    }
  }

});


/* =========================================
   KONIEC
========================================= */

function finish(){

  $("finalScore")
  .textContent=
    score+
    " / "+
    questions.length;

  const percent=
    questions.length
    ? score/questions.length
    : 0;

  const remaining=
    Object.keys(
      getMistakes()
    ).length;

  $("finalMessage")
  .textContent=

    remaining===0 &&
    questions.length>0

    ? "🎉 Výborne! Všetky uložené chyby sú opravené."

    : percent===1

    ? "Perfektné! Bez chyby. 🌟"

    : percent>=0.8

    ? "Výborne! 🚀"

    : percent>=0.6

    ? "Pekná práca. 💪"

    : "Skús ešte jeden tréning. 🌱";

  updateMistakeCount();

  show("finish");
}


/* =========================================
   ŠTART
========================================= */

updateMistakeCount();

</script>

</html>
